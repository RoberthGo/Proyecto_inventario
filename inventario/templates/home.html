{% extends "master.html" %}

{% block content %}
<h1>Proveedores</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Correo</th>
        </tr>
    </thead>
    <tbody>
        {% for proveedor in proveedores %}
        <tr>
            <td>{{ proveedor.nombre }}</td>
            <td>{{ proveedor.telefono }}</td>
            <td>{{ proveedor.correo }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No hay proveedores registrados.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
