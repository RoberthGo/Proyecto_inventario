{% extends 'master.html' %}

{% block title %}Proveedores{% endblock %}

{% block content %}
<table id="tabla-proveedores"  class="table">
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Correo</th>
        </tr>
    </thead>
    <tbody>
        {% for proveedor in object_list %}
        <tr>
            <td>{{ proveedor.nombre }}</td>
            <td>{{ proveedor.telefono }}</td>
            <td>{{ proveedor.correo }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
